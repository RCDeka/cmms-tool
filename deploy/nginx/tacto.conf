# Tacto: Nginx site (docs/architecture.md → Overview; README → Deployment).
# Install as /etc/nginx/sites-available/tacto, link it into sites-enabled, and replace
# every "cmms.example.com" with your domain. HTTPS certificates come from Let's Encrypt.

upstream tacto_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP: only the Let's Encrypt challenge, everything else goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name cmms.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cmms.example.com;

    ssl_certificate     /etc/letsencrypt/live/cmms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cmms.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 128k;  # the API refuses JSON bodies over 100 kB anyway

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Only the shell is served from here: index.html, sw.js and the files under assets/.
    # The rest of frontend/ (package.json, tests, node_modules) is never exposed (D31).
    root /opt/tacto/frontend;

    # API → Node.js on the loopback interface. Express sets the API security headers itself.
    location /api/ {
        proxy_pass http://tacto_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static files of the shell. File names carry no hash, so browsers revalidate (ETag);
    # the service worker keeps them for offline use (D28).
    location ~ ^/assets/.+\.(css|js|svg|png|ico|woff2?)$ {
        include snippets/tacto-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # The service worker must always be checked for a new version.
    location = /sw.js {
        include snippets/tacto-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Any other path is a client route (/assets, /assets/12, /work-orders/new, …): the shell.
    # Never use "$uri/" here: frontend/assets/ shares its prefix with the /assets route, and a
    # directory redirect would turn /assets into /assets/ (docs/architecture.md → Client routes).
    location / {
        include snippets/tacto-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
}
