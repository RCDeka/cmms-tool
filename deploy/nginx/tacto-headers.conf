# Security headers for the static shell served by Nginx (install as
# /etc/nginx/snippets/tacto-headers.conf). Express sets the same ones on API answers.
# The Content-Security-Policy must stay identical to backend/src/app.js
# (checked by backend/test/api/deploy-config.test.js).
add_header Content-Security-Policy "default-src 'self';script-src 'self';style-src 'self';img-src 'self' data:;connect-src 'self';font-src 'self';object-src 'none';base-uri 'self';form-action 'self';frame-ancestors 'none';worker-src 'self';manifest-src 'self'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
